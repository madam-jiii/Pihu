<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>🌷 Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floating-heart" style="top:8%; left:6%;"><i class="fas fa-heart"></i></div>
  <div class="floating-heart" style="bottom:12%; right:4%; animation-delay:3s;"><i class="fas fa-heart"></i></div>
  <div class="sparkle" style="top:20%; right:10%;"><i class="fas fa-star"></i></div>
  <div class="sparkle" style="bottom:30%; left:6%; animation-delay:5s;"><i class="fas fa-sparkles"></i></div>

  <div class="page-wrapper">
    <div class="section" id="gallery">
      <div class="section-inner">
        <div data-aos="fade-up">
          <h2 style="font-size:2rem;">Our Little Gallery</h2>
          <p class="script" style="font-size:1.1rem; color:#b38b96;">A few little things I wanted you to see ♡</p>
        </div>
        <div class="polaroid" data-aos="fade-up" data-aos-delay="100" id="polaroid">
          <div class="polaroid-inner">
            <div class="tape"><i class="fas fa-heart" style="color:#ff8a9c;"></i></div>
            <div class="image-container" id="imageContainer">
              <img id="gallery-img" src="assets/images/1.jpg" alt="memory" />
            </div>
          </div>
          <div class="gallery-counter" id="gallery-counter">1 / 5</div>
        </div>
        <div class="gallery-nav" data-aos="fade-up">
          <button class="btn btn-outline" id="prevGallery" style="padding:0.6rem 1.5rem;"><i class="fas fa-chevron-left"></i> Back</button>
          <button class="btn" id="nextGallery" style="padding:0.6rem 1.5rem;">Next <i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="text-center" data-aos="fade-up" data-aos-delay="200" id="gallery-end" style="display:none;">
          <p class="script" style="font-size:1.3rem; color:#4a3f5c;">That's all for now...<br />but I have one more thing for you. ♡</p>
          <a href="letter.html" class="btn" style="margin-top:1.5rem;">A Letter For You <i class="fas fa-envelope"></i></a>
        </div>
        <div class="text-center nav-prev" data-aos="fade-up" data-aos-delay="150">
          <a href="message.html" class="btn"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
      </div>
    </div>
  </div>

  <style>
    .image-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1/1.1;
      overflow: hidden;
      border-radius: 16px;
      background: #faf0f0;
    }

    #gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
    }

    #gallery-img.slide-out {
      transform: translateX(-120%) rotate(-8deg) scale(0.8);
      opacity: 0;
    }

    #gallery-img.slide-in {
      transform: translateX(0) rotate(0deg) scale(1);
      opacity: 1;
    }

    #gallery-img.slide-in-from-right {
      transform: translateX(120%) rotate(8deg) scale(0.8);
      opacity: 0;
    }

    #gallery-img.slide-out-right {
      transform: translateX(120%) rotate(8deg) scale(0.8);
      opacity: 0;
    }

    #gallery-img.slide-in-from-left {
      transform: translateX(-120%) rotate(-8deg) scale(0.8);
      opacity: 0;
    }

    .polaroid {
      background: white;
      border-radius: 24px 24px 20px 20px;
      padding: 1rem 1rem 1.6rem;
      box-shadow: 0 12px 30px rgba(160, 120, 130, 0.08);
      transform: rotate(-1deg);
      border: 1px solid #ffecf0;
      margin: 0.5rem 0;
      transition: transform 0.3s ease;
    }

    .polaroid:hover {
      transform: rotate(0deg) scale(1.01);
    }

    .polaroid-inner {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #faf0f0;
    }

    .tape {
      position: absolute;
      top: -6px;
      left: 20%;
      background: rgba(255, 240, 220, 0.7);
      padding: 0.2rem 1.2rem;
      border-radius: 4px;
      font-size: 1.2rem;
      transform: rotate(-6deg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      backdrop-filter: blur(2px);
      color: #b38b96;
      z-index: 2;
    }

    .gallery-counter {
      font-size: 0.9rem;
      color: #b38b96;
      font-weight: 500;
      margin-top: 0.6rem;
    }

    .gallery-nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.8rem;
    }

    .gallery-nav .btn {
      padding: 0.6rem 1.6rem;
      font-size: 0.9rem;
    }

    .btn-outline {
      background: transparent;
      color: #ff8a9c;
      border: 2px dashed #ffb3c1;
      box-shadow: none;
    }

    .btn-outline:active {
      transform: scale(0.94);
    }

    @media (max-width: 420px) {
      .polaroid {
        padding: 0.8rem 0.8rem 1.2rem;
      }
      .tape {
        font-size: 1rem;
        padding: 0.1rem 1rem;
        top: -4px;
      }
    }
  </style>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    (function() {
      AOS.init({ once: false, duration: 800, offset: 20 });

      const images = ['assets/images/1.jpg','assets/images/2.jpg','assets/images/3.jpg','assets/images/4.jpg','assets/images/5.jpg'];
      let currentImg = 0;
      const imgEl = document.getElementById('gallery-img');
      const counter = document.getElementById('gallery-counter');
      const prevBtn = document.getElementById('prevGallery');
      const nextBtn = document.getElementById('nextGallery');
      const endMsg = document.getElementById('gallery-end');
      let isAnimating = false;

      function updateCounterAndEnd() {
        // Update counter
        counter.textContent = (currentImg + 1) + ' / ' + images.length;
        
        // Show/hide end message
        if (currentImg === images.length - 1) {
          endMsg.style.display = 'block';
        } else {
          endMsg.style.display = 'none';
        }
      }

      function updateGallery(direction) {
        if (isAnimating) return;

        if (direction === 'next') {
          if (currentImg >= images.length - 1) return;
          
          // Slide out to left
          imgEl.classList.remove('slide-in', 'slide-in-from-right', 'slide-in-from-left', 'slide-out-right');
          imgEl.classList.add('slide-out');
          
          isAnimating = true;
          setTimeout(() => {
            currentImg++;
            imgEl.src = images[currentImg];
            imgEl.classList.remove('slide-out');
            imgEl.classList.add('slide-in-from-right');
            
            setTimeout(() => {
              imgEl.classList.remove('slide-in-from-right');
              imgEl.classList.add('slide-in');
              isAnimating = false;
              updateCounterAndEnd();
            }, 50);
          }, 500);
          
        } else if (direction === 'prev') {
          if (currentImg <= 0) return;
          
          // Slide out to right
          imgEl.classList.remove('slide-in', 'slide-in-from-right', 'slide-in-from-left', 'slide-out');
          imgEl.classList.add('slide-out-right');
          
          isAnimating = true;
          setTimeout(() => {
            currentImg--;
            imgEl.src = images[currentImg];
            imgEl.classList.remove('slide-out-right');
            imgEl.classList.add('slide-in-from-left');
            
            setTimeout(() => {
              imgEl.classList.remove('slide-in-from-left');
              imgEl.classList.add('slide-in');
              isAnimating = false;
              updateCounterAndEnd();
            }, 50);
          }, 500);
        }
      }

      // Initialize
      imgEl.classList.add('slide-in');
      updateCounterAndEnd();

      if (nextBtn) {
        nextBtn.addEventListener('click', function() { 
          updateGallery('next'); 
        });
        prevBtn.addEventListener('click', function() { 
          updateGallery('prev'); 
        });
      }

      if (imgEl) {
        imgEl.addEventListener('click', function() { 
          if (currentImg < images.length - 1) {
            updateGallery('next'); 
          }
        });
      }

      // Envelope logic from script.js
      const envelopeWrapper = document.getElementById('envelopeWrapper');
      const letterBtn = document.getElementById('letterBtnWrap');
      if (envelopeWrapper) {
        envelopeWrapper.addEventListener('click', function() {
          this.classList.toggle('open');
          if (letterBtn) letterBtn.style.display = this.classList.contains('open') ? 'block' : 'none';
        });
        if (envelopeWrapper.classList.contains('open') && letterBtn) {
          letterBtn.style.display = 'block';
        }
      }

      document.querySelectorAll('.reveal-card').forEach(card => {
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          this.classList.toggle('revealed');
        });
      });

      AOS.refresh();
    })();
  </script>
</body>
</html>
