<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>🌷 Distance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floating-heart" style="top:8%; left:6%;"><i class="fas fa-heart"></i></div>
  <div class="floating-heart" style="bottom:12%; right:4%; animation-delay:3s;"><i class="fas fa-heart"></i></div>
  <div class="sparkle" style="top:20%; right:10%;"><i class="fas fa-star"></i></div>
  <div class="sparkle" style="bottom:30%; left:6%; animation-delay:5s;"><i class="fas fa-sparkles"></i></div>

  <div class="page-wrapper">
    <div class="section" id="distance">
      <div class="section-inner">
        <div data-aos="fade-up">
          <div class="text-center">
            <span class="distance-badge">1,900 km</span>
            <p class="script" style="font-size:1.1rem; margin-top:-0.2rem; color:#b38b96;">between us</p>
          </div>
        </div>
        <div data-aos="fade-up" data-aos-delay="100">
          <div class="map-card">
            <div class="map-svg-wrap">
              <svg viewBox="0 0 300 260" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="300" height="260" rx="30" fill="#f5e6e8" />
                <path d="M70 190 Q160 170 240 80" stroke="#ff8a9c" stroke-width="2.5" stroke-dasharray="8 6" class="dash-path" fill="none" />
                <circle cx="70" cy="190" r="14" fill="#ff8a9c" />
                <circle cx="70" cy="190" r="6" fill="white" class="pulse-dot" />
                <text x="58" y="218" class="pin-label" font-size="15" font-weight="600">Me</text>
                <circle cx="240" cy="80" r="14" fill="#ff8a9c" />
                <circle cx="240" cy="80" r="6" fill="white" class="pulse-dot" style="animation-delay:0.3s;" />
                <text x="224" y="63" class="pin-label" font-size="15" font-weight="600">You</text>
                <circle cx="35" cy="55" r="3" fill="#ffd4dd" />
                <circle cx="260" cy="215" r="3" fill="#ffd4dd" />
                <circle cx="150" cy="35" r="2" fill="#ffd4dd" />
                <circle cx="30" cy="155" r="2" fill="#ffd4dd" />
                <circle cx="270" cy="135" r="2" fill="#ffd4dd" />
                <circle cx="195" cy="185" r="2" fill="#ffd4dd" />
                <circle cx="115" cy="115" r="2" fill="#ffd4dd" />
              </svg>
            </div>
          </div>
        </div>

        <div class="text-center" data-aos="fade-up" data-aos-delay="200">
          <p class="script" style="font-size:1.2rem; color:#4a3f5c;">...but never between our hearts. ❤️</p>
          <a href="message.html" class="btn" style="margin-top:1.5rem; background:#ff8a9c; color:white; border:none; box-shadow:0 6px 18px rgba(255,138,156,0.3);">Keep Going <i class="fas fa-arrow-right"></i></a>
        </div>
        <div class="text-center nav-prev" data-aos="fade-up" data-aos-delay="250">
          <a href="home.html" class="btn" style="background:transparent; color:#b38b96; box-shadow:none; border:2px dashed #ffb3c1; padding:0.5rem 1.2rem; font-size:0.9rem;"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
      </div>
    </div>
  </div>

  <style>
    .dash-path {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawRoute 2.8s ease forwards;
    }
    @keyframes drawRoute {
      to { stroke-dashoffset: 0; }
    }
    .map-card {
      background: #faf0f0;
      border-radius: 40px;
      padding: 1.8rem 1.2rem 1.2rem;
      box-shadow: 0 8px 28px rgba(180, 130, 150, 0.08);
      border: 1px solid #f5e6e8;
      margin: 0.8rem 0;
    }
    .distance-badge {
      font-size: 3rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -1px;
      line-height: 1;
    }
    .pin-label {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      fill: #1a1a2e;
    }
    .pulse-dot {
      animation: pulsePin 2s infinite;
    }
    @keyframes pulsePin {
      0% { r: 6; opacity: 1; }
      50% { r: 16; opacity: 0.2; }
      100% { r: 6; opacity: 1; }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #ff8a9c;
      color: white;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: 0 6px 18px rgba(255, 138, 156, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.94);
      box-shadow: 0 2px 10px rgba(255, 138, 156, 0.2);
    }
    .nav-prev .btn:active {
      transform: scale(0.94);
    }
  </style>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
</html>
