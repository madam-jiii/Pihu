<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>🌷 I Love You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floating-heart" style="top:8%; left:6%;"><i class="fas fa-heart"></i></div>
  <div class="floating-heart" style="bottom:12%; right:4%; animation-delay:3s;"><i class="fas fa-heart"></i></div>
  <div class="sparkle" style="top:20%; right:10%;"><i class="fas fa-star"></i></div>
  <div class="sparkle" style="bottom:30%; left:6%; animation-delay:5s;"><i class="fas fa-sparkles"></i></div>

  <div class="page-wrapper">
    <div class="section section-pure" id="final">
      <div class="section-inner">
        <div class="text-center" data-aos="zoom-in" data-aos-duration="1200">
          <div class="final-heart-simple">
            <i class="fas fa-heart" style="font-size:5rem; color:#ff8a9c; animation:pulseGlow 2.2s infinite;"></i>
          </div>
          <div class="floating-small-hearts" style="margin:0.5rem 0 1.2rem;">
            <i class="fas fa-heart" style="color:#ff8a9c;"></i>
            <i class="fas fa-heart" style="color:#ff8a9c; font-size:1.2rem;"></i>
            <i class="fas fa-heart" style="color:#ff8a9c;"></i>
            <i class="fas fa-heart" style="color:#ff8a9c; font-size:1.2rem;"></i>
          </div>
          <h1 style="font-size:2.6rem;">I Love You.</h1>
          <p class="script" style="font-size:1.3rem; color:#4a3f5c; margin-top:0.8rem;">I can't wait to see you again. ❤️</p>
          <p class="script" style="font-size:1.2rem; color:#b38b96; margin-top:1.2rem;">Rest well, take care of yourself,<br />and keep that beautiful smile safe for me.</p>
          <p class="script" style="font-size:1.3rem; color:#1a1a2e; margin-top:2rem;">Your happiness will always matter to me. ❤️</p>
        </div>
        <div class="text-center nav-prev" data-aos="fade-up" data-aos-delay="100">
          <a href="index.html" class="btn"><i class="fas fa-home"></i> Start Over</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
</html>
